spring:
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/dream_market}
    username: ${DB_USER:dream_user}
    password: ${DB_PASSWORD:dream_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BROKER:localhost:29092}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  flyway:
    enabled: true

logging:
  level:
    root: INFO
    org.springframework.security: INFO

springdoc:
  swagger-ui:
    url: /openapi.yaml

app:
  kafka:
    visualization-topic: ${VIS_TOPIC:visualization-requests}
  yandex:
    client-id: ${YANDEX_CLIENT_ID:}
    client-secret: ${YANDEX_CLIENT_SECRET:}
    redirect-uri: ${YANDEX_REDIRECT_URI:http://localhost:8080/oauth/yandex/callback}
  jwt:
    secret: ${JWT_SECRET:change-me}
    issuer: dream-marketplace
    access-token-ttl-seconds: ${JWT_TTL_SECONDS:3600}
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:dream-visuals}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadminpass}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
