version: "3.9"

services:
  # -------------------------------------------------
  # PostgreSQL
  # -------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: dream_market_db
    restart: always
    environment:
      POSTGRES_DB: dream_market
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # -------------------------------------------------
  # Flyway (DB migrations)
  # -------------------------------------------------
  flyway:
    image: flyway/flyway:10.15.0
    container_name: dream_market_flyway
    depends_on:
      - db
    command: >
      -url=jdbc:postgresql://db:5432/dream_market
      -user=${DB_USER}
      -password=${DB_PASSWORD}
      -locations=filesystem:/flyway/sql
      migrate
    volumes:
      - ./src/main/resources/db/migration:/flyway/sql
    restart: "no"

  # -------------------------------------------------
  # Redpanda (Kafka API, без ZK)
  # -------------------------------------------------
  kafka:
    image: vectorized/redpanda:v23.3.22
    container_name: dream_market_kafka
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 1G
      - --overprovisioned
      - --node-id 0
      - --check=false
      - --kafka-addr PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      - --advertise-kafka-addr PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
    ports:
      - "29092:29092"
    volumes:
      - redpanda_data:/var/lib/redpanda/data

  # -------------------------------------------------
  # MinIO (S3 compatible storage)
  # -------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: dream_market_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # -------------------------------------------------
  # MinIO bucket initialization
  # -------------------------------------------------
  minio-create-bucket:
    image: minio/mc:latest
    container_name: dream_market_minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
        set -e;
        echo 'Waiting for MinIO...';
        for i in \$(seq 1 60); do
          mc alias set minio http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY} && break || sleep 1;
        done;
        mc mb -p minio/${S3_BUCKET} || true;
        mc anonymous set download minio/${S3_BUCKET} || true;
        echo 'MinIO bucket initialized';
      "
    restart: "no"

  # -------------------------------------------------
  # Backend (пока закомментирован)
  # -------------------------------------------------
  # backend:
  #   build: ./backend
  #   container_name: dream_market_backend
  #   depends_on:
  #     - db
  #     - kafka
  #     - minio
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/dream_market
  #     SPRING_DATASOURCE_USERNAME: ${DB_USER}
  #     SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
  #
  #     SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  #
  #     S3_ENDPOINT: http://minio:9000
  #     S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  #     S3_SECRET_KEY: ${S3_SECRET_KEY}
  #     S3_BUCKET: ${S3_BUCKET}

# -------------------------------------------------
# Volumes
# -------------------------------------------------
volumes:
  postgres_data:
  minio_data:
